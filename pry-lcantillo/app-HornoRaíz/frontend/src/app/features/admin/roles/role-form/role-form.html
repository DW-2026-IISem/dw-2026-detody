<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label for="name" class="text-sm font-semibold text-slate-300"
      >Nombre del Rol (Mayúsculas) *</label
    >
    <input
      pInputText
      id="name"
      formControlName="name"
      placeholder="Ej: SUPERVISOR"
      [fluid]="true"
    />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <p-message severity="error" text="El nombre del rol es obligatorio (máximo 60 caracteres)" />
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="description" class="text-sm font-semibold text-slate-300">Descripción</label>
    <input
      pInputText
      id="description"
      formControlName="description"
      placeholder="Propósito de este rol..."
      [fluid]="true"
    />
  </div>

  @if (!role()) {
    <div class="flex flex-col gap-1">
      <label for="status" class="text-sm font-semibold text-slate-300">Estado Inicial *</label>
      <p-select
        id="status"
        formControlName="status"
        [options]="statuses"
        optionLabel="label"
        optionValue="value"
        [fluid]="true"
      />
    </div>
  }

  <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-slate-700">
    <p-button
      type="button"
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      (click)="cancel()"
    />
    <p-button
      type="submit"
      [label]="role() ? 'Actualizar Rol' : 'Crear Rol'"
      severity="primary"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="form.invalid || saving()"
    />
  </div>
</form>
