<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label for="client-name" class="mb-1 block text-sm font-medium text-slate-700">
      Nombre <span class="text-red-500">*</span>
    </label>
    <input
      id="client-name"
      pInputText
      formControlName="name"
      placeholder="Panadería La Especial"
      autocomplete="organization"
      class="w-full"
    />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p-message severity="error" size="small" variant="simple" styleClass="mt-1">
        El nombre es obligatorio (máximo 120 caracteres).
      </p-message>
    }
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div>
      <label for="client-phone" class="mb-1 block text-sm font-medium text-slate-700">
        Teléfono
      </label>
      <input
        id="client-phone"
        pInputText
        formControlName="phone"
        placeholder="300 000 0000"
        autocomplete="tel"
        class="w-full"
      />
    </div>

    <div>
      <label for="client-email" class="mb-1 block text-sm font-medium text-slate-700">
        Email
      </label>
      <input
        id="client-email"
        type="email"
        pInputText
        formControlName="email"
        placeholder="cliente@correo.com"
        autocomplete="email"
        class="w-full"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p-message severity="error" size="small" variant="simple" styleClass="mt-1">
          Formato de email inválido.
        </p-message>
      }
    </div>
  </div>

  <div>
    <label for="client-address" class="mb-1 block text-sm font-medium text-slate-700">
      Dirección
    </label>
    <textarea
      id="client-address"
      pTextarea
      formControlName="address"
      rows="2"
      placeholder="Calle 10 # 20-30, Barrio Centro"
      class="w-full"
    ></textarea>
  </div>

  <div>
    <label for="client-status" class="mb-1 block text-sm font-medium text-slate-700">
      Estado
    </label>
    <p-select
      inputId="client-status"
      formControlName="status"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [fluid]="true"
    />
    @if (client()) {
      <p class="mt-1 text-xs text-slate-500">
        El estado de un cliente existente solo cambia con la baja lógica.
      </p>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button
      pButton
      type="button"
      severity="secondary"
      outlined
      class="border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg px-4 py-2 font-medium transition-colors"
      (click)="cancelled.emit()"
    >
      <span pButtonLabel>Cancelar</span>
    </button>
    <button
      pButton
      type="submit"
      [loading]="saving()"
      class="bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-lg px-5 py-2 shadow-sm hover:shadow border-none transition-all duration-200 cursor-pointer"
    >
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>
