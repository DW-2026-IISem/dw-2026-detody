<div class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <!-- Header ocupando toda la parte superior -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-xs">
    <app-header (menuRequested)="onMenuToggle()" />
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Aside en escritorio -->
    <aside
      class="hidden lg:block w-72 shrink-0 border-r border-slate-200 bg-white p-4 overflow-y-auto"
      aria-label="Navegación principal"
    >
      <app-aside [items]="items" />
    </aside>

    <!-- Área principal donde se renderizan las rutas con router-outlet -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <div class="max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>
  </div>

  <!-- Footer cerrando todo el ancho -->
  <footer class="border-t border-slate-200 bg-white">
    <app-footer />
  </footer>

  <!-- Drawer para pantallas móviles -->
  <p-drawer
    [visible]="mobileOpen()"
    (visibleChange)="mobileOpen.set($event)"
    header="Menú de Navegación"
    position="left"
    [modal]="true"
    styleClass="w-80"
  >
    <app-aside [items]="items" (navigated)="onNavigate()" />
  </p-drawer>

  <!-- Notificaciones globales Toast y diálogos de confirmación -->
  <p-toast position="top-right" />
  <p-confirmdialog />
</div>
